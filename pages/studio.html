<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Sessions — DJ C.O.B | THE VOLUME MASTER</title>
  <meta name="description" content="Recent studio sessions by DJ C.O.B — recording, mixing, mastering and production.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Studio Sessions — DJ C.O.B | THE VOLUME MASTER">
  <meta property="og:description" content="Recent studio sessions by DJ C.O.B — recording, mixing, mastering and production.">
  <meta property="og:image" content="../Assets/img/studio/stu.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="../Assets/img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../Assets/css/header-footer.css">
  <link rel="stylesheet" href="../Assets/css/studio.css">
</head>
<body><div id="preloader" aria-hidden="true"><div class="pre-inner"><div class="pre-logo"><img src="../Assets/img/logo.jpg" alt="C.O.B"></div><h1 class="pre-name"><span class="p-c">C</span><span class="p-dot">.</span><span class="p-o">O</span><span class="p-dot">.</span><span class="p-b">B</span></h1><div class="pre-loader" aria-hidden="true"></div><p class="pre-slogan">Volume Tingz</p></div></div>
  <div id="site-header"></div>

  <main>
    <section class="page-head">
      <div class="container">
        <span class="section-tag">The Studio</span>
        <h1 class="section-title">Studio Sessions</h1>
        <p class="section-sub">Every session tells a story. Here's a look at recent work in the lab — recording, mixing, mastering and full production.</p>
      </div>
    </section>

    <section class="section section-filter">
      <div class="container">
        <div class="filter-bar">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="Recording">Recording</button>
          <button class="filter-btn" data-filter="Mixing">Mixing</button>
          <button class="filter-btn" data-filter="Mastering">Mastering</button>
          <button class="filter-btn" data-filter="Production">Production</button>
        </div>
        <div class="session-grid" id="sessionGrid"></div>
      </div>
    </section>

    <section class="section section-alt">
      <div class="container">
        <span class="section-tag">New Session</span>
        <h2 class="section-title">Log a Session</h2>
        <p class="section-sub">Quickly log a new studio session for your wall. Sessions are saved on this device.</p>
        <form id="sessionForm" class="session-form">
          <div class="form-row">
            <div class="form-group">
              <label for="sTitle">Session Title</label>
              <input type="text" id="sTitle" placeholder="e.g. Recording — Mwansa Single" required>
            </div>
            <div class="form-group">
              <label for="sDate">Date</label>
              <input type="date" id="sDate" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="sTags">Type</label>
              <select id="sTags">
                <option value="Recording">Recording</option>
                <option value="Mixing">Mixing</option>
                <option value="Mastering">Mastering</option>
                <option value="Production">Production</option>
              </select>
            </div>
            <div class="form-group">
              <label for="sImg">Image URL (optional)</label>
              <input type="text" id="sImg" placeholder="paste an image link or leave empty">
            </div>
          </div>
          <div class="form-group">
            <label for="sDesc">Description</label>
            <textarea id="sDesc" rows="3" placeholder="What happened in this session?"></textarea>
          </div>
          <button type="submit" class="btn btn-neon">Add Session</button>
        </form>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <div class="toast" id="toast"></div>

    <script src="../Assets/js/global.js"></script>
<script src="../Assets/js/loader.js"></script>
  <script src="../Assets/js/studio.js"></script>
</body>
</html>
